<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 72" role="img" aria-label="Signal locked">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#070b12"/>
      <stop offset="0.5" stop-color="#0c1524"/>
      <stop offset="1" stop-color="#070b12"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5eead4" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="72" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="70" fill="none" stroke="#1e3a4c" stroke-width="1"/>
  <rect x="0" y="0" width="4" height="72" fill="#5eead4"/>
  <rect x="1196" y="0" width="4" height="72" fill="#5eead4"/>

  <circle cx="36" cy="36" r="6" fill="#5eead4">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="36" cy="36" r="11" fill="none" stroke="#5eead4" stroke-width="1" opacity="0.45">
    <animate attributeName="r" values="9;15;9" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="1.6s" repeatCount="indefinite"/>
  </circle>

  <text x="58" y="32" fill="#5eead4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="3.2">SIGNAL LOCKED</text>
  <text x="58" y="52" fill="#8ba3b7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.6">iOS DEVELOPER  ·  WTW  ·  KOLKATA</text>

  <text x="1140" y="32" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="end" letter-spacing="2">UTC +5:30</text>
  <text x="1140" y="52" fill="#5eead4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="end" letter-spacing="2">JU CSE  ·  IEEE 2025</text>

  <rect x="0" y="70" width="180" height="2" fill="url(#scan)">
    <animate attributeName="x" values="-180;1200" dur="3.4s" repeatCount="indefinite"/>
  </rect>
</svg>
